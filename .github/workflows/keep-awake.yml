name: Keep Streamlit apps awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours; Streamlit sleeps apps after ~12 idle hours
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/keep_awake.py
